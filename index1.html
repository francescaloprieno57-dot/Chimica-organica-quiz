            { q: "Quale tra i seguenti è un solvente polare aprotico?", options: ["DMSO", "H₂O", "CH₃OH", "NH₃"], correct: "DMSO" },
            { q: "Quale solvente favorisce maggiormente SN2?", options: ["Solvente polare aprotico", "Solvente protico fortemente acido", "Solvente aromatico", "Solvente non polare"], correct: "Solvente polare aprotico" }
        ]
    };

    let currentChapter = null;
    let questionsPool = [];
    let currentQuestionIndex = 0;
    let score = 0;

    function startChapter(chapterNum) {
        currentChapter = chapterNum;
        questionsPool = [...chaptersData[chapterNum]].sort(() => Math.random() - 0.5);
        currentQuestionIndex = 0;
        score = 0;

        document.getElementById("menu-screen").style.display = "none";
        document.getElementById("quiz-screen").style.display = "block";
        document.getElementById("score-screen").style.display = "none";

        loadQuestion();
    }

    function loadQuestion() {
        document.getElementById("next-btn").style.display = "none";
        const qData = questionsPool[currentQuestionIndex];

        document.getElementById("counter").innerText = `Domanda ${currentQuestionIndex + 1}/${questionsPool.length}`;
        document.getElementById("question-text").innerText = qData.q;

        const optionsContainer = document.getElementById("options-container");
        optionsContainer.innerHTML = "";

        const shuffledOptions = [...qData.options].sort(() => Math.random() - 0.5);

        shuffledOptions.forEach(option => {
            const btn = document.createElement("button");
            btn.className = "btn";
            btn.innerText = option;
            btn.onclick = () => selectAnswer(btn, option, qData.correct);
            optionsContainer.appendChild(btn);
        });
    }

    function selectAnswer(selectedBtn, chosen, correct) {
        const buttons = document.getElementById("options-container").getElementsByTagName("button");
        
        for (let btn of buttons) {
            btn.disabled = true;
            if (btn.innerText === correct) {
                btn.classList.add("correct");
            } else if (btn.innerText === chosen && chosen !== correct) {
                btn.classList.add("wrong");
            }
        }

        if (chosen === correct) {
            score++;
        }

        document.getElementById("next-btn").style.display = "block";
    }

    function nextQuestion() {
        currentQuestionIndex++;
        if (currentQuestionIndex < questionsPool.length) {
            loadQuestion();
        } else {
            showScore();
        }
    }

    function showScore() {
        document.getElementById("quiz-screen").style.display = "none";
        document.getElementById("score-screen").style.display = "block";
        
        const percentage = Math.round((score / questionsPool.length) * 100);
        document.getElementById("final-score").innerText = `Hai risposto correttamente a ${score} su ${questionsPool.length} domande (${percentage}%)`;
    }

    function returnToMenu() {
        document.getElementById("score-screen").style.display = "none";
        document.getElementById("menu-screen").style.display = "block";
    }
</script>

</body>
</html>
