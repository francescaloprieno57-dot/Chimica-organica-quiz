    let activeQuestions = [];
    let currentIdx = 0;
    let score = 0;
    let answered = false;
    let currentCorrectAnswer = "";

    function shuffle(array) {
        let currentIndex = array.length, randomIndex;
        while (currentIndex !== 0) {
            randomIndex = Math.floor(Math.random() * currentIndex);
            currentIndex--;
            [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
        }
        return array;
    }

    function startChapter(chapterNum) {
        activeQuestions = shuffle([...chaptersData[chapterNum]]);
        currentIdx = 0;
        score = 0;
        document.getElementById("menu-screen").style.display = "none";
        document.getElementById("score-screen").style.display = "none";
        document.getElementById("quiz-screen").style.display = "block";
        loadQuestion();
    }

    function loadQuestion() {
        answered = false;
        document.getElementById("next-btn").style.display = "none";
        const q = activeQuestions[currentIdx];
        document.getElementById("counter").innerText = `Domanda ${currentIdx + 1}/${activeQuestions.length}`;
        document.getElementById("question-text").innerText = q.q;
        
        currentCorrectAnswer = q.correct;
        let shuffledOptions = shuffle([...q.options]);

        const optionsContainer = document.getElementById("options-container");
        optionsContainer.innerHTML = "";
        
        shuffledOptions.forEach((opt) => {
            const btn = document.createElement("button");
            btn.className = "btn";
            btn.innerText = opt;
            btn.onclick = () => selectOption(opt, btn);
            optionsContainer.appendChild(btn);
        });
    }

    function selectOption(selectedText, btn) {
        if (answered) return;
        answered = true;
        
        const buttons = document.querySelectorAll("#options-container .btn");
        
        if (selectedText === currentCorrectAnswer) {
            btn.classList.add("correct");
            score++;
        } else {
            btn.classList.add("wrong");
            buttons.forEach(b => {
                if (b.innerText === currentCorrectAnswer) {
                    b.classList.add("correct");
                }
            });
        }
        
        document.getElementById("next-btn").style.display = "block";
    }

    function nextQuestion() {
        currentIdx++;
        if (currentIdx < activeQuestions.length) {
            loadQuestion();
        } else {
            document.getElementById("quiz-screen").style.display = "none";
            document.getElementById("score-screen").style.display = "block";
            document.getElementById("final-score").innerText = `Hai totalizzato ${score} su ${activeQuestions.length} risposte esatte!`;
        }
    }

    function returnToMenu() {
        document.getElementById("score-screen").style.display = "none";
        document.getElementById("menu-screen").style.display = "block";
    }
